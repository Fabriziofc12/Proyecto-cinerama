name: Cinerama CI Pipeline

# Define cuándo se ejecutará automáticamente este flujo
on:
  push:
    branches: [ main, master ]  # Se dispara en cada push hacia la rama principal
  pull_request:
    branches: [ main, master ]  # Se dispara en cada pull request hacia la rama principal

jobs:
  build-and-test:
    runs-on: ubuntu-latest  # Ejecuta el flujo en un servidor virtual limpio con Linux

    steps:
    # 1. Descarga el código fuente actual del repositorio en el servidor de pruebas
    - name: Checkout del repositorio
      uses: actions/checkout@v4

    # 2. Configura el entorno de Node.js (cámbialo si tu proyecto usa Java u otro stack)
    - name: Configurar entorno Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # 3. Instala todas las dependencias necesarias del proyecto
    - name: Instalar dependencias del proyecto
      run: npm install

    # 4. Compila la aplicación para verificar que no existan errores de sintaxis (Build)
    - name: Compilar proyecto (Build)
      run: npm run build --if-present

    # 5. Ejecuta las pruebas automáticas configuradas en el proyecto (Test)
    - name: Ejecutar pruebas automatizadas
      run: npm test

#pruebas 